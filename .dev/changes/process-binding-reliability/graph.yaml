target:
    statement: >-
        Make caller-process workspace binding reliable under verified runtime conditions without
        requiring Agent harness cooperation, while keeping failure explicit, Agent
        recovery actionable, and the implementation concentrated behind a workspace
        binding boundary.
    success:
        - Two independent calls from one long-lived caller under documented verified conditions can confirm and reuse one binding.
        - Insufficient evidence never creates a confirmed binding from guessed ancestry.
        - Pending retry, targeted cancellation, confirmed unbind, and output states follow the accepted SPEC.
        - Windows-native behavior remains independent of MSYS; MSYS is activated only by runtime evidence.
        - The final module structure matches an accepted SHAPE and does not broadly reorganize unrelated workspace code.
        - Automated and real-runtime evidence supports the documented verification boundary without hard-excluding untested environments.
        - A durable project developer document preserves the technical basis, design rationale, evidence, and maintenance constraints.

accepted_state:
    - id: A1
      validity: current
      evidence: user decision and DEV-SPEC
      statement: >-
          Process binding remains a zero-harness-intrusion, two-call protocol that
          selects the nearest reliably identified common process instance.
    - id: A2
      validity: current
      evidence: LAI #17, LAI #19, and process-binding-reliability.TECH-REPORT.md
      statement: >-
          Windows-native ancestry cannot recover an exited intermediate creator;
          current Pi/MSYS2 and two real Git for Windows CLI-shaped calls can bridge
          owning MSYS logical ancestry to Windows ancestry. A non-owning MSYS table
          is rejected because it does not contain the current CLI WINPID.
    - id: A3
      validity: current
      evidence: user decision on 2026-09-07
      statement: >-
          Confirm may be retried with the same unexpired nonce; current commands use
          compact Agent-oriented success text by default and explicit JSON mode;
          pending cancellation is separate from confirmed unbind.
    - id: A4
      validity: current
      evidence: user selected architecture option B on 2026-09-07
      statement: >-
          Keep workspace and current as distinct CLI namespaces, move the current
          command implementation into the workspace domain, and concentrate process
          binding in an independent src/workspace/binding/ submodule.
    - id: A5
      validity: current
      evidence: user decision and technical report
      statement: >-
          MSYS is a capability-detected Windows-side branch, not a core product path;
          pipe-endpoint PID evidence is deferred unless the ancestry route proves insufficient.
    - id: A6
      validity: current
      evidence: user decision on 2026-09-08 and accepted DEV-SPEC
      statement: >-
          Implicit business calls fail before any SiYuan request when confirmed records remain
          but process evidence cannot determine binding applicability; explicit selectors bypass
          observation, and calls with no remaining confirmed records skip it.
    - id: A7
      validity: current
      evidence: user decision on 2026-09-08 and accepted DEV-SPEC
      statement: >-
          Pending records expire by time; confirmed records are reclaimed only when the anchor PID
          is conclusively absent or authoritative start identity proves reuse. Unknown records remain.
          Existing process-instance matching is preserved, and documentation distinguishes tested
          environments from unverified ones instead of hard-excluding them.
    - id: A8
      validity: current
      evidence: user decision on 2026-09-08
      statement: >-
          The final Change includes a durable .dev/docs developer document that lets maintainers
          recover the process-binding technical basis, chosen design, evidence, verification method,
          and maintenance constraints without reconstructing Change history.
    - id: A9
      validity: current
      evidence: user acceptance and process-binding-reliability.SHAPE.md on 2026-09-08
      statement: >-
          Process binding is organized by responsibility under workspace/binding:
          process semantics, observation, persisted state, and protocol are separate;
          Windows capture owns a nested MSYS process-table helper selected by capability,
          and workspace resolution consumes domain outcomes rather than platform stop reasons.
    - id: A10
      validity: current
      evidence: N7 real-runtime matrix, TECH-REPORT, and .dev/docs/process-binding.md on 2026-09-08
      statement: >-
          The complete protocol is verified in real Pi/MSYS2, Git for Windows Bash,
          and native PowerShell caller scopes, including read-only dev resolution,
          retry/cancel/unbind, conservative reclamation, explicit-selector bypass,
          fail-before-request uncertainty, and precise unbind with concurrent records.
          Complete no-match remains fixture-covered because all measured Windows tails truncated.

nodes:
    N1:
        title: Finalize process-binding behavior contract
        lai_issue: 18
        status: accepted
        accepted_at: 2026-09-08
        depends_on: []
        purpose: >-
            Close the user-owned behavior decisions still marked open in the DEV-SPEC.
        allowed_effects:
            - Update DEV-SPEC and graph accepted state.
            - Record user decisions in LAI.
            - Do not modify production code.
        expected_result: A user-confirmed DEV-SPEC ready to constrain architecture.
        acceptance:
            - Business-call behavior for uncertain process observation is explicit.
            - Confirmed-binding reclamation responsibility is explicit.
            - Supported environment boundary and process-instance validation are explicit.
            - DEV-SPEC status can move from clarifying to accepted.

    N2:
        title: Validate process ancestry in real Git Bash calls
        lai_issue: 19
        status: accepted
        accepted_at: 2026-09-08
        depends_on: []
        purpose: >-
            Close the technical-report gap with two independent calls launched through
            the actual Git for Windows runtime rather than source inference alone.
        allowed_effects:
            - Add isolated spike evidence or update the technical report.
            - Do not modify production code or product requirements.
        expected_result: Accepted evidence that the hybrid route works, fails, or needs a different conditional branch.
        acceptance:
            - Record Git Bash and ps runtime versions.
            - Prove current WINPID membership and the MSYS-to-Windows handoff in two independent calls.
            - Identify the same long-lived caller or give a bounded reproducible failure.
            - Record output-format and multiple-installation constraints.

    N3:
        title: Shape the process-binding architecture and diff
        lai_issue: 20
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N1, N2]
        purpose: >-
            Inspect the current import graph and turn the accepted workspace/binding
            boundary into a reviewable predicted diff before implementation.
        allowed_effects:
            - Create and revise process-binding-reliability.SHAPE.md.
            - Inspect code and add non-production architecture evidence.
            - Do not implement the change before user acceptance.
        expected_result: A user-accepted SHAPE with file moves, ownership, dependencies, and magnitude.
        acceptance:
            - Preserve workspace/current CLI namespaces while removing the shallow src/current domain.
            - Define the independent workspace/binding boundary and output ownership.
            - Resolve deprecated-alias dependency direction without broad unrelated reorganization.
            - Identify stable interfaces that allow N4 and N5 to proceed independently.
            - Receive explicit user acceptance and set SHAPE status to accepted.

    N4:
        title: Implement reliable process observation
        lai_issue: 21
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N3]
        purpose: >-
            Implement platform-neutral observation plus Windows-native and
            capability-detected MSYS ancestry under the accepted interfaces.
        allowed_effects:
            - Modify only the observation files, their direct exports, and focused tests predicted by SHAPE.
            - Do not change binding lifecycle or CLI behavior.
        expected_result: A tested observation implementation that distinguishes usable, conclusive no-match, and insufficient evidence.
        acceptance:
            - Windows-native calls do not require MSYS.
            - MSYS activates only when its table contains the current Windows PID.
            - Hybrid ancestry reaches the accepted common caller in fixtures and the required local runtime.
            - Missing or inconsistent evidence is not returned as a silently complete chain.
            - Linux and macOS behavior does not regress.

    N5:
        title: Implement binding lifecycle and Agent-facing commands
        lai_issue: 22
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N3]
        purpose: >-
            Implement the accepted pending/confirmed state transitions and current
            command output without owning platform observation details.
        allowed_effects:
            - Modify binding protocol, current command presentation, shared output integration, and focused tests predicted by SHAPE.
            - Do not implement Windows or MSYS capture.
        expected_result: A tested bind/confirm/retry/cancel/unbind protocol with compact and JSON output.
        acceptance:
            - An unexpired nonce can retry confirm without extending expiry.
            - cancel targets one pending nonce without process observation.
            - unbind affects confirmed bindings only.
            - Compact output gives exact next actions; JSON mode follows the project output contract.
            - Failure details state whether binding exists, pending state remains, and a SiYuan request was sent.

    N6:
        title: Integrate binding outcomes into workspace resolution
        lai_issue: 23
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N4, N5]
        purpose: >-
            Connect accepted observation outcomes and binding state to effective
            workspace resolution without leaking platform mechanics.
        allowed_effects:
            - Modify resolver integration and cross-module tests predicted by SHAPE.
            - Preserve explicit-selector and project-conflict contracts from the SPEC.
        expected_result: One coherent selection path for match, conclusive no-match, and uncertain observation.
        acceptance:
            - Explicit selection precedence remains unchanged.
            - Resolver behavior matches the N1 uncertainty decision.
            - No request is sent after a fatal selection uncertainty.
            - Commands that do not need process binding avoid unnecessary observation when permitted by the contract.

    N7:
        title: Verify process binding under declared runtime conditions
        lai_issue: 24
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N6]
        purpose: >-
            Verify the integrated behavior against the declared runtime boundary and
            failure cases before user-facing guidance is finalized.
        allowed_effects:
            - Add or update tests, reproducible runtime evidence, and fixes within accepted SHAPE.
            - Return material structural deviations to N3 instead of expanding silently.
        expected_result: Accepted automated and real-runtime evidence for the complete behavior contract.
        acceptance:
            - Real Pi/MSYS2 bind, confirm retry, which, business use, cancel, and unbind pass.
            - Real Git Bash scenarios required by the SPEC pass.
            - Windows-native and existing Linux-compatible tests pass.
            - Missing table, broken handoff, PID reuse, expiry, and stale-state failures are explicit.
            - Typecheck, test, and build pass.

    N9:
        title: Document process-binding technical foundations
        lai_issue: 26
        status: accepted
        accepted_at: 2026-09-08
        depends_on: [N6]
        purpose: >-
            Preserve the cross-platform process model, design rationale, verified evidence,
            and maintenance constraints as durable project developer documentation.
            Drafting may proceed alongside N7; acceptance waits for N7 evidence to be incorporated.
        allowed_effects:
            - Create and maintain .dev/docs/process-binding.md and its .dev/project.md index entry.
            - Reference final source, tests, durable contracts, and external evidence without changing runtime behavior.
        expected_result: >-
            A cold maintainer can understand and safely modify or revalidate process binding
            without reconstructing this Change or treating untested environments as hard-excluded.
        acceptance:
            - Explain why Windows ancestry alone is insufficient and how the conditional MSYS-to-Windows handoff works.
            - Explain two-call scope selection, process-instance identity, observation outcomes, lifecycle, and fail-loud behavior.
            - Distinguish tested evidence from unverified environments and provide a reproducible verification route.
            - Map concepts to authoritative source, tests, SPECs, and external constraints without narrating obvious code.
            - Contain current-state knowledge only, omit transient sample PIDs and investigation chronology, and define update triggers.
            - Be listed in the .dev/project.md Docs Index.

    N8:
        title: Finalize process-binding guidance and change artifacts
        lai_issue: 25
        status: active
        active_owner: S647
        depends_on: [N7, N9]
        purpose: >-
            Publish only verified behavior and leave code, durable contracts, skill
            content, and Change artifacts in their final state.
        allowed_effects:
            - Update bundled SKILL, durable workspace SPEC, changelog if required, and Change artifacts.
            - Remove obsolete investigation wording and consumed temporary material with user permission where required.
        expected_result: Final user guidance and a completed Change consistent with the accepted SHAPE.
        acceptance:
            - SKILL teaches compact default usage, retry, cancel, unbind, failure recovery, and tested-environment boundaries.
            - No development wrapper commands or historical diagnoses remain in user-facing text.
            - The durable process-binding developer document is consistent with final code and verified evidence.
            - Final diff is compared with SHAPE and material deviations are resolved.
            - DEV-SPEC and SHAPE have final status; graph has no blocking unresolved area.

