            recover the long-lived caller in an environment required by the verification target.
        effect_if_activated: >-
            Add a formal research/design node before changing the process-observation
            contract; do not fold pipe peers into ancestry without user approval.

unresolved_areas: []

risks:
    - id: R1
      statement: Treating every missing Windows parent as fatal would reject valid chains that already contain the anchor.
      control: Preserve stop reasons; bind/confirm may succeed when a reliable common anchor was observed before truncation, while an implicit no-match from a truncated chain remains insufficient.
    - id: R2
      statement: A generic multi-signal evidence model would broaden identity semantics and test combinations.
      control: Keep pipe evidence conditional and out of the first implementation route.
    - id: R3
      statement: Broad workspace reorganization could hide the reliability fix in unrelated movement.
      control: SHAPE starts from the accepted binding submodule and expands only when a concrete dependency requires it.
    - id: R4
      statement: Concurrent delegated writers could invent incompatible interfaces or collide in one worktree.
      control: Accept N3 first; give N4 and N5 disjoint ownership and separate worktrees when delegated.
    - id: R5
      statement: A live but unrelated confirmed binding can force another caller with insufficient observation to choose a workspace explicitly.
      control: Fail before any SiYuan request, provide an exact explicit-selector recovery, skip observation when no confirmed records remain, and reclaim only conclusively stale records.
    - id: R6
      statement: A developer document that copies implementation detail or investigation history will drift and mislead future maintainers.
      control: Write N9 after integrated verification; document external constraints, rationale, evidence, authority links, and update triggers while leaving local mechanics to code and tests.

runtime_rules:
    - The user is target authority; only the user changes product scope or observable guarantees.
    - The primary supervisor is the only writer of graph.yaml.
    - DEV-SPEC owns requirements, TECH-REPORT owns accepted technical evidence, graph.yaml owns route state, and LAI owns operational issue state.
    - No production implementation starts before N1, N2, and N3 are accepted.
    - Delegated sessions receive a self-contained brief under this Change and do not edit graph.yaml.
    - Parallel write nodes use separate worktrees under .worktrees/ and integrate through fix/process-binding-reliability.
    - Subagent or external-session results remain proposals until the supervisor validates and records acceptance.
    - New findings modify the graph only when they change a hard dependency, activate a candidate, invalidate accepted state, or expose a new responsibility closure.
