<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>caller current prototype</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; background: #111827; color: #e5e7eb; }
    h1 { margin-top: 0; }
    .note { color: #cbd5e1; max-width: 850px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    section { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 16px; }
    button, select { font: inherit; padding: 8px 10px; margin: 4px 4px 4px 0; }
    button { cursor: pointer; }
    pre { min-height: 260px; overflow: auto; background: #030712; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .state { color: #93c5fd; }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
    code { color: #fde68a; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Caller-scoped current workspace</h1>
  <p class="note">
    这是产品行为原型，不是真实进程树实现。它让你检查命令面、两步绑定、项目文件冲突和
    <code>workspace verify</code> / <code>current verify</code> 的语义。
  </p>

  <div class="grid">
    <section>
      <h2>模拟当前调用者</h2>
      <label>workspace：
        <select id="workspace">
          <option>home</option><option>dev</option><option>research</option>
        </select>
      </label>
      <label>项目文件：
        <select id="project">
          <option value="none">无</option><option value="home">home</option>
          <option value="dev">dev</option><option value="research">research</option>
        </select>
      </label>
      <p>
        <button onclick="bind()">current bind &lt;workspace&gt;</button>
        <button onclick="confirmBind()">current confirm &lt;nonce&gt;</button>
        <button onclick="unbind()">current unbind</button>
      </p>
      <p>
        <button onclick="which()">current which</button>
        <button onclick="currentVerify()">current verify</button>
        <button onclick="workspaceVerify()">workspace verify &lt;name&gt;</button>
      </p>
      <p>
        <button onclick="setSharedAncestor(true)">模拟：只能找到共享宿主</button>
        <button onclick="setSharedAncestor(false)">模拟：找到调用者专属锚点</button>
        <button onclick="resetAll()">重置</button>
      </p>
      <p class="state" id="state"></p>
    </section>

    <section>
      <h2>CLI transcript</h2>
      <pre id="output"></pre>
    </section>
  </div>

  <script>
    const state = {
      pending: null,
      binding: null,
      sharedAncestor: false,
      global: 'home',
      reachable: new Set(['home', 'dev'])
    };

    const $ = id => document.getElementById(id);
    const selectedWorkspace = () => $('workspace').value;
    const projectWorkspace = () => $('project').value === 'none' ? null : $('project').value;
    const nonce = () => Math.random().toString(36).slice(2, 8).toUpperCase();

    function print(lines, className = '') {
      $('output').className = className;
      $('output').textContent += lines + '\n';
      $('output').scrollTop = $('output').scrollHeight;
    }

    function resolved() {
      const project = projectWorkspace();
      const bound = state.binding?.workspace ?? null;
      if (project && bound && project !== bound) {
        return { error: 'CURRENT_SELECTION_CONFLICT', message: `项目文件选择 "${project}" 与 caller bind "${bound}" 不一致。请使用相同 workspace，或执行 current unbind。` };
      }
      if (bound) return { workspace: bound, source: 'process-binding' };
      if (project) return { workspace: project, source: 'project-file' };
      return { workspace: state.global, source: 'global-current' };
    }

    function renderState() {
      const selected = resolved();
      $('state').textContent = JSON.stringify({ binding: state.binding, project: projectWorkspace(), resolved: selected }, null, 2);
    }

    function bind() {
      const workspace = selectedWorkspace();
      const project = projectWorkspace();
      if (project && project !== workspace) {
        print(`$ siyuan-cli current bind ${workspace}\n{"error":"CURRENT_SELECTION_CONFLICT","message":"项目文件已选择 \\\"${project}\\\"，不能绑定 \\\"${workspace}\\\"。","hint":"请绑定 ${project}，或执行 current unbind 后移除/修改项目文件。"}`, 'error');
        return;
      }
      state.pending = { workspace, nonce: nonce() };
      print(`$ siyuan-cli current bind ${workspace}\nProbe captured. Run in another independent tool call:\n  siyuan-cli current confirm ${state.pending.nonce}\n\nIf this is not the intended workspace, run current unbind before continuing.`);
      renderState();
    }

    function confirmBind() {
      if (!state.pending) {
        print('{"error":"NO_PENDING_BIND","message":"没有待确认的 bind。"}', 'error');
        return;
      }
      if (state.sharedAncestor) {
        print('{"error":"SHARED_PROCESS_ANCHOR","message":"两次调用只能找到共享宿主，拒绝创建 caller binding。","hint":"请在同一个独立 Agent/session 或交互 shell 中重新执行 bind，再在新的独立调用中 confirm。"}', 'error');
        state.pending = null;
        renderState();
        return;
      }
      state.binding = { workspace: state.pending.workspace, anchor: 'node.exe / pid+creation-time', lifetime: 'until anchor exits' };
      print(`$ siyuan-cli current confirm ${state.pending.nonce}\nBound workspace "${state.binding.workspace}" to this caller.\n\nFuture api/tool calls can omit --workspace.\nRun current which to inspect the active source, or current unbind to remove it.`, 'success');
      state.pending = null;
      renderState();
    }

    function unbind() {
      state.binding = null;
      state.pending = null;
      print('$ siyuan-cli current unbind\nCaller binding removed.');
      renderState();
    }

    function which() {
      const result = resolved();
      print('$ siyuan-cli current which\n' + JSON.stringify(result, null, 2), result.error ? 'error' : '');
    }

    function currentVerify() {
      const result = resolved();
      if (result.error) {
        print('$ siyuan-cli current verify\n' + JSON.stringify(result), 'error');
      } else if (!state.reachable.has(result.workspace)) {
        print(`$ siyuan-cli current verify\n{"error":"VERIFY_FAILED","workspace":"${result.workspace}"}`, 'error');
      } else {
        print(`$ siyuan-cli current verify\n{"ok":true,"workspace":"${result.workspace}","source":"${result.source}"}`, 'success');
      }
    }

    function workspaceVerify() {
      const workspace = selectedWorkspace();
      const ok = state.reachable.has(workspace);
      print(`$ siyuan-cli workspace verify ${workspace}\n${JSON.stringify({ workspace, ok })}`, ok ? 'success' : 'error');
    }

    function setSharedAncestor(value) {
      state.sharedAncestor = value;
      print(value ? 'Simulation: shared ancestor detected; confirm will refuse.' : 'Simulation: exclusive ancestor restored.');
      renderState();
    }

    function resetAll() {
      state.pending = null; state.binding = null; state.sharedAncestor = false; $('output').textContent = '';
      renderState();
    }

    renderState();
    print('Choose a scenario, then inspect current which / current verify.');
  </script>
</body>
</html>
